name: Offline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: windows-11-arm
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and simulated-device tests
        run: python -m unittest discover -s tests -v
      - name: Check the CLI version
        run: python honor_x8a_debloater.py --version
      - name: Check the shell launcher
        if: runner.os != 'Windows'
        run: sh -n start_macos_linux.sh
